[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vitamin-analysis-laboratory"
version = "1.0.0"
description = "Asyncio and validated FastAPI experiments in a vitamin analysis laboratory"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2.0", "pytest>=8.3,<9.0", "ruff>=0.11,<1.0"]

[tool.setuptools.packages.find]
include = ["app*", "async_lab*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

