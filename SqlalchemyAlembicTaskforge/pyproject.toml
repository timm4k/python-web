[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-workflow-api"
version = "1.0.0"
description = "Async SQLAlchemy and Alembic workflow for musical production"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.121,<1",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0.41,<2.1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "black>=26,<27",
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

