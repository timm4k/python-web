[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "perfume-object-lab"
version = "1.0.0"
description = "An interactive Python object model and inheritance laboratory"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "mypy>=1.15,<2.0", "pytest>=8.3,<9.0", "ruff>=0.11,<1.0"]

[tool.setuptools.packages.find]
include = ["app*", "object_model*", "inheritance_contracts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

